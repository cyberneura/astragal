<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="dark" />
    <style>html { color-scheme: dark; background: var(--terminal-background, #111111); }</style>
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Astragal</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <main id="app">
      <div id="workspace">
        <div id="terminal-pane">
          <header id="tab-bar" data-tauri-drag-region>
            <div id="traffic-light-space" data-tauri-drag-region></div>
            <div id="app-title" data-tauri-drag-region>Astragal</div>
            <div id="tabs" role="tablist"></div>
            <div id="drag-space" data-tauri-drag-region></div>
            <button id="new-tab" type="button" title="New tab (⌘T)" aria-label="New tab">+</button>
            <button id="chat-toggle" type="button" data-annotate="chat-toggle" aria-label="Toggle agent chat" aria-expanded="false" aria-controls="agent-chat" hidden></button>
          </header>
          <section id="terminals" aria-label="Terminal sessions"></section>
        </div>
        <aside id="agent-chat" aria-label="Agent chat" hidden></aside>
      </div>
    </main>
  </body>
</html>
